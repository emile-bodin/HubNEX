# Ready-made images of the add-on, one per architecture, so Home Assistant downloads HubNEX
# instead of building it. They are published on GitHub Packages (ghcr.io) when the version in
# hubnex/config.yaml changes, or by hand from the Actions tab.
name: Build add-on images

on:
  push:
    branches: [main]
    paths:
      - hubnex/config.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version=$(python3 -c "import yaml; print(yaml.safe_load(open('hubnex/config.yaml'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    name: Build image ${{ matrix.arch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.arch }}-addon-hubnex" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: hubnex
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            io.hass.name=HubNEX
            io.hass.type=addon
            io.hass.version=${{ needs.version.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
