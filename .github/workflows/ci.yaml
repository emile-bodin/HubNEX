# Checks every change: the add-on's tests, the dashboard's scripts and the add-on manifest.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Add-on tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hubnex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hubnex/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check Assist integration syntax
        run: python -m compileall -q integration/hubnex

  dashboard:
    name: Dashboard scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module syntax
        run: for f in hubnex/web/*.js; do node --check "$f" || exit 1; done

  ui:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hubnex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hubnex/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix tests/ui --no-audit --no-fund
      - run: npx --prefix tests/ui playwright install --with-deps chromium
      - name: Browser tests (demo home and fake Claude)
        run: node --test --test-reporter=spec tests/ui/*.test.cjs

  addon:
    name: Add-on manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./hubnex"
