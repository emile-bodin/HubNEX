name: An idea
description: A new feature or an improvement.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The problem, or the moment of the day when something is missing, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you picture it
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Examples, screenshots, how you solve it today.
