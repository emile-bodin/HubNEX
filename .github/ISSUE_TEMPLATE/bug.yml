name: Something doesn't work
description: An error, unexpected behaviour, something that broke with an update.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before sending it, remove **API keys, tokens, emails, addresses and
        names** from logs and screenshots. For a security vulnerability do not open a public
        issue: read [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open the Home view
        2. Tap …
        3. …
  - type: input
    id: version
    attributes:
      label: HubNEX version
      description: Top left in the dashboard, or on the add-on page.
      placeholder: "1.9.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.0"
  - type: dropdown
    id: hardware
    attributes:
      label: Where Home Assistant runs
      options:
        - Raspberry Pi
        - Home Assistant Green / Yellow
        - Mini PC or PC (x86)
        - Virtual machine
        - Other
  - type: dropdown
    id: area
    attributes:
      label: Part involved
      multiple: true
      options:
        - Home view / floor plan
        - Energy
        - Assistant and agents
        - Voice / Assist
        - Telegram
        - Mail
        - MCP connectors
        - Installation / update
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Add-on log
      description: Settings → Add-ons → HubNEX → Log. Only the relevant lines, without personal data.
      render: text
  - type: textarea
    id: screens
    attributes:
      label: Screenshots
      description: Drag images here, if they help.
