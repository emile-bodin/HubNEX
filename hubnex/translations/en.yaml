configuration:
  claude_auth_mode:
    name: "Claude sign-in"
    description: "api_key = the Anthropic API key; subscription = your Claude subscription through Claude Code; hybrid = the subscription where possible, the API key otherwise."
  claude_subscription_enabled:
    name: "Claude subscription"
    description: "Allow using your Claude subscription (sign in from the dashboard)."
  claude_api_fallback:
    name: "Fall back to the API key"
    description: "When the subscription cannot answer, use the API key instead."
  anthropic_api_key:
    name: Anthropic API key
    description: The key to use Claude (console.anthropic.com). Not needed if you only use other providers.
  model_jarvis:
    name: Jarvis model
    description: Used by Jarvis and by agents that don't set their own in agents.yaml. Claude by name (claude-sonnet-5-5), others with the provider's prefix - openai:gpt-5-mini, ollama:qwen3:14b, compat:model-name.
  model_mail:
    name: Jarvis Mail model
  model_voice:
    name: Quick command model
    description: The quick route for requests about the house (dashboard and Assist). Haiku is the fastest; complex questions still go to Jarvis' model. Empty = no quick route.
  anthropic_credit_usd:
    name: Anthropic credit ($)
    description: Your balance on console.anthropic.com. The dashboard counts down the estimated cost of each request. Enter the new balance after a top-up. 0 = show spend only.
  monthly_budget_usd:
    name: Monthly Claude budget ($)
    description: A warning in the Telegram group and in the notifications when this month's spend reaches 80% and 100%. Only a warning, HubNEX doesn't stop. 0 = no warning.
  openai_api_key:
    name: OpenAI API key
    description: For models written as openai:name (platform.openai.com).
  openai_base_url:
    name: OpenAI API address
    description: Empty = OpenAI's own. Change it only for a service that mimics OpenAI with the same key.
  ollama_url:
    name: Ollama address
    description: For local models written as ollama:name, e.g. http://192.168.1.20:11434. Free and cloud-free; you need a model that can use tools (qwen3, llama3.1, mistral-small).
  compat_base_url:
    name: Another compatible service's address
    description: For models written as compat:name. Any OpenAI-compatible server, up to /v1 - LM Studio (http://IP:1234/v1), OpenRouter (https://openrouter.ai/api/v1), Gemini (https://generativelanguage.googleapis.com/v1beta/openai), Mistral, DeepSeek, Groq.
  compat_api_key:
    name: Compatible service's key
    description: That service's key; empty if it asks for none (LM Studio).
  other_price_input:
    name: Other models' input price ($ per million tokens)
    description: To count the spend of openai and compat models, from the provider's price list. 0 = not counted. Ollama models are always free.
  other_price_output:
    name: Other models' output price ($ per million tokens)
    description: As above, for the reply tokens.
  telegram_token_jarvis:
    name: Jarvis bot token
  telegram_token_mail:
    name: Jarvis Mail bot token
  allowed_chat_id:
    name: Group ID
    description: Negative number. Send /id in the group to see it.
  allowed_user_id:
    name: Your Telegram user ID
  telegram_voice_replies:
    name: Voice replies on Telegram
  imap_host:
    name: IMAP server
  imap_port:
    name: IMAP port
  smtp_host:
    name: SMTP server
  smtp_port:
    name: SMTP port
  mail_user:
    name: Mailbox
  mail_password:
    name: Mail password
  mail_from_name:
    name: Sender name
  mail_signature:
    name: Signature
  check_interval_minutes:
    name: Mail check (minutes)
  notify_min_priority:
    name: Notify from priority
  mail_ignore:
    name: Senders not to announce
    description: Comma separated. An address (offers@shop.com), a domain (@newsletter.com) or a word of the address (noreply). Their emails stay in the mailbox, but no Telegram message.
  hq_token:
    name: HQ token
    description: Password for the dashboard outside HA and for the API. Not needed from the sidebar.
  elevenlabs_api_key:
    name: ElevenLabs API key
  elevenlabs_voice_id:
    name: ElevenLabs voice ID
  elevenlabs_model:
    name: ElevenLabs model
  voice_tts_entity:
    name: Voice from Home Assistant
    description: Instead of ElevenLabs, one of Home Assistant's TTS engines (e.g. tts.piper, free and local). Takes precedence when set.
  voice_tts_voice:
    name: Home Assistant engine voice
    description: The name of the voice to use with the engine above (e.g. Rinaldo or Diego for Home Assistant Cloud). Empty = its default voice. The language is the add-on's (Language option).
  language:
    name: Language
    description: en = English; nl = Dutch (Nederlands); auto = Home Assistant's language (Dutch if Home Assistant is set to Dutch, otherwise English). Used by the assistant, the agents, Telegram and the add-on's messages; each person can still pick their own language for the dashboard under Preferences.
  voice_answers:
    name: Spoken answers
    description: completa = the voice reads the whole answer; riassunto = for long answers the voice says only the gist in one or two sentences, the written text stays complete.
  ha_blocked_services:
    name: Blocked HA services
  install_assist_integration:
    name: Assist integration
    description: Install and update the integration that makes Jarvis an Assist conversation agent.
  non_admin_access:
    name: Non-admin users
    description: "casa: Home Assistant users who are not administrators only get the house view (no assistant, mail, agents or floor plan changes). completo: they get everything, like an administrator."
  chat_history_turns:
    name: "Conversation memory"
    description: "How many earlier messages of the conversation Jarvis reads back with each new message."
  chat_voice_history_turns:
    name: "Assist conversation memory"
    description: "The same for Assist (voice): a short memory keeps it quick."
  chat_new_session_after_hours:
    name: "New conversation after silence (hours)"
    description: "After this many hours without messages, the dashboard or a Telegram chat starts a new conversation by itself. 0 = never (start one with the list in the chat or /new in Telegram)."
  chat_keep_sessions:
    name: "Conversations kept"
    description: "How many conversations are kept per channel; the oldest are forgotten."
  chat_trash_days:
    name: "Days to undo a deletion"
    description: "A deleted conversation can be brought back for this many days."
  chat_live_text:
    name: "Live answers"
    description: "The answer appears in the chat while it is being written."
  chat_show_tools:
    name: "Show tool steps"
    description: "Keep and show what the assistant looked up or did on the way to an answer."
  chat_max_parallel:
    name: "Model calls at once"
    description: "How many AI requests may run at the same time. One place is always kept free for a person, so routines never make you wait."
  ha_mcp_enabled:
    name: "Home Assistant tools (MCP)"
    description: "The built-in Home Assistant tools ported from brAIn: devices, areas, automations and their traces, camera frames and more, for Jarvis and the agents."
  ha_mcp_groups:
    name: "Home Assistant tool groups"
    description: "read (states, areas, devices, history), control (lights, climate, locks… through the rules below), automation (configs and traces), camera (frames), dashboards (read), exposure (what assistants reach, how entities show), system (error log, reload, events)."
  ha_mcp_exclude_tools:
    name: "Tools switched off"
    description: "Single tools to leave out, separated by commas (e.g. render_template,fire_event)."
  ha_mcp_agents:
    name: "Who gets the Home Assistant tools"
    description: "Agent ids separated by commas (boss = Jarvis). Empty = Jarvis and every agent."
  ha_mcp_confirm:
    name: "Confirmation for changes"
    description: "writes = tools that change the house wait for your OK (except the free ones below); always = every tool waits; never = nothing waits."
  ha_mcp_free_tools:
    name: "Changes without confirmation"
    description: "Tools that change the house but run at once, separated by commas."
  ha_protected_entities:
    name: "Protected entities"
    description: "Entities never acted on by the assistant, from any channel: entity ids or whole domains (lock.front_door,alarm_control_panel.*). They can still be looked at."
  ha_voice_blocked_services:
    name: "Services blocked for voice"
    description: "Extra services Assist (voice) may never call, on top of the blocked HA services: domain.service or domain.*."
  ha_voice_exposed_only:
    name: "Voice reaches only exposed entities"
    description: "Through Assist the tools reach only what Home Assistant exposes to Assist."
  ha_action_log_days:
    name: "Action log (days)"
    description: "How long the log of everything the assistant did in Home Assistant is kept."
  mcp_expose:
    name: "Offer HubNEX as an MCP server"
    description: "Other AI clients (Claude Code, Claude Desktop…) can use HubNEX's tools at /mcp on the add-on's port, with the token below."
  mcp_expose_tools:
    name: "What /mcp offers"
    description: "ha = the Home Assistant tools; sessions = HubNEX's conversations (list, read, ask Jarvis); team = the team (status, give a task)."
  mcp_expose_read_only:
    name: "/mcp read-only"
    description: "Outside clients only get the tools that read. Switch off to let them act too."
  mcp_token:
    name: "/mcp token"
    description: "The token outside clients send as Bearer. Empty = the HQ token."
  mcp_connectors:
    name: "MCP connectors"
    description: "The programs of your work through MCP (Streamable HTTP), next to the ones in agents.yaml (the same name here wins). agents, free and exclude are comma separated."
  mcp_use_server_instructions:
    name: "Use the servers' instructions"
    description: "What each MCP server says about its tools goes into the assistant's instructions."
  mcp_image_results:
    name: "Images from tools"
    description: "Images a tool returns (camera frames…) are shown to the assistant."
  mcp_tool_search:
    name: "Tool search"
    description: "With many connector tools, offer only a few at once and let the assistant search for the rest: fewer tokens per message."
  mcp_max_result_kb:
    name: "Tool result size (KB)"
    description: "The longest answer of a connector tool the assistant reads."
network:
  8765/tcp: Dashboard and API (optional, requires the HQ token)
