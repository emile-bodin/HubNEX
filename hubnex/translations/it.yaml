configuration:
  anthropic_api_key:
    name: Anthropic API key
    description: The key to use Claude (console.anthropic.com). Not needed if you only use other providers.
  model_jarvis:
    name: Jarvis model
    description: Used by Jarvis and by agents that don't set their own in agents.yaml. Claude by name (claude-sonnet-5-5), others with the provider's prefix - openai:gpt-5-mini, ollama:qwen3:14b, compat:model-name.
  model_mail:
    name: Jarvis Mail model
  model_voice:
    name: Quick command model
    description: The quick route for requests about the house (dashboard and Assist). Haiku is the fastest; complex questions still go to Jarvis' model. Empty = no quick route.
  anthropic_credit_usd:
    name: Anthropic credit ($)
    description: Your balance on console.anthropic.com. The dashboard counts down the estimated cost of each request. Enter the new balance after a top-up. 0 = show spend only.
  monthly_budget_usd:
    name: Monthly Claude budget ($)
    description: A warning in the Telegram group and in the notifications when this month's spend reaches 80% and 100%. Only a warning, HubNEX doesn't stop. 0 = no warning.
  openai_api_key:
    name: OpenAI API key
    description: For models written as openai:name (platform.openai.com).
  openai_base_url:
    name: OpenAI API address
    description: Empty = OpenAI's own. Change it only for a service that mimics OpenAI with the same key.
  ollama_url:
    name: Ollama address
    description: For local models written as ollama:name, e.g. http://192.168.1.20:11434. Free and cloud-free; you need a model that can use tools (qwen3, llama3.1, mistral-small).
  compat_base_url:
    name: Another compatible service's address
    description: For models written as compat:name. Any OpenAI-compatible server, up to /v1 - LM Studio (http://IP:1234/v1), OpenRouter (https://openrouter.ai/api/v1), Gemini (https://generativelanguage.googleapis.com/v1beta/openai), Mistral, DeepSeek, Groq.
  compat_api_key:
    name: Compatible service's key
    description: That service's key; empty if it asks for none (LM Studio).
  other_price_input:
    name: Other models' input price ($ per million tokens)
    description: To count the spend of openai and compat models, from the provider's price list. 0 = not counted. Ollama models are always free.
  other_price_output:
    name: Other models' output price ($ per million tokens)
    description: As above, for the reply tokens.
  telegram_token_jarvis:
    name: Jarvis bot token
  telegram_token_mail:
    name: Jarvis Mail bot token
  allowed_chat_id:
    name: Group ID
    description: Negative number. Send /id in the group to see it.
  allowed_user_id:
    name: Your Telegram user ID
  telegram_voice_replies:
    name: Voice replies on Telegram
  imap_host:
    name: IMAP server
  imap_port:
    name: IMAP port
  smtp_host:
    name: SMTP server
  smtp_port:
    name: SMTP port
  mail_user:
    name: Mailbox
  mail_password:
    name: Mail password
  mail_from_name:
    name: Sender name
  mail_signature:
    name: Signature
  check_interval_minutes:
    name: Mail check (minutes)
  notify_min_priority:
    name: Notify from priority
  mail_ignore:
    name: Senders not to announce
    description: Comma separated. An address (offers@shop.com), a domain (@newsletter.com) or a word of the address (noreply). Their emails stay in the mailbox, but no Telegram message.
  hq_token:
    name: HQ token
    description: Password for the dashboard outside HA and for the API. Not needed from the sidebar.
  elevenlabs_api_key:
    name: ElevenLabs API key
  elevenlabs_voice_id:
    name: ElevenLabs voice ID
  elevenlabs_model:
    name: ElevenLabs model
  voice_tts_entity:
    name: Voice from Home Assistant
    description: Instead of ElevenLabs, one of Home Assistant's TTS engines (e.g. tts.piper, free and local). Takes precedence when set.
  voice_tts_voice:
    name: Home Assistant engine voice
    description: The name of the voice to use with the engine above (e.g. Rinaldo or Diego for Home Assistant Cloud). Empty = its default voice. The language is the add-on's (Language option).
  language:
    name: Language
    description: en = English; nl = Dutch (Nederlands); auto = Home Assistant's language (Dutch if Home Assistant is set to Dutch, otherwise English). Used by the assistant, the agents, Telegram and the add-on's messages; each person can still pick their own language for the dashboard under Preferences.
  voice_answers:
    name: Spoken answers
    description: completa = the voice reads the whole answer; riassunto = for long answers the voice says only the gist in one or two sentences, the written text stays complete.
  ha_blocked_services:
    name: Blocked HA services
  install_assist_integration:
    name: Assist integration
    description: Install and update the integration that makes Jarvis an Assist conversation agent.
  non_admin_access:
    name: Non-admin users
    description: "casa: Home Assistant users who are not administrators only get the house view (no assistant, mail, agents or floor plan changes). completo: they get everything, like an administrator."
network:
  8765/tcp: Dashboard and API (optional, requires the HQ token)
