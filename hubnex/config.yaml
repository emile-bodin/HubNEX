name: HubNEX
version: "1.24.1.c"
slug: hubnex
description: AI headquarters for home and work, with Claude agents, a 3D Home Assistant dashboard, Telegram, voice and MCP connectors.
url: https://github.com/emile-bodin/HubNEX
# Immagini già pronte (GitHub Actions → ghcr.io): Home Assistant le scarica invece di costruirle
image: ghcr.io/emile-bodin/{arch}-addon-hubnex
arch:
  - amd64
  - aarch64
init: false
# Accesso all'API di Home Assistant tramite il Supervisor (niente token da creare)
homeassistant_api: true
# Dashboard nella barra laterale di HA
ingress: true
ingress_port: 8765
# Visible to every Home Assistant user; who is not an administrator gets the house only
# (non_admin_access), checked by the add-on on every request.
panel_admin: false
panel_icon: mdi:robot-happy-outline
panel_title: HubNEX
# Porta esterna facoltativa (disattivata di default): serve solo per aprire la dashboard
# fuori da HA o per chiamare l'API da altri dispositivi, sempre con hq_token.
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Dashboard e API (facoltativa, richiede hq_token)
# /config dentro l'add-on = cartella addon_configs/<id>_hubnex (contiene agents.yaml)
map:
  - addon_config:rw
  # Solo per installare/aggiornare l'integrazione Assist in custom_components/hubnex
  - homeassistant_config:rw
# Annuncia l'add-on a Home Assistant: l'integrazione Assist si configura con un clic
discovery:
  - hubnex
options:
  anthropic_api_key: ""
  claude_auth_mode: api_key
  claude_subscription_enabled: false
  claude_api_fallback: false
  model_jarvis: claude-sonnet-5-5
  model_mail: claude-haiku-5-5
  model_voice: claude-haiku-5-5
  anthropic_credit_usd: 0
  monthly_budget_usd: 0
  openai_api_key: ""
  openai_base_url: ""
  ollama_url: ""
  compat_base_url: ""
  compat_api_key: ""
  other_price_input: 0
  other_price_output: 0
  telegram_token_jarvis: ""
  telegram_token_mail: ""
  allowed_chat_id: ""
  allowed_user_id: ""
  telegram_voice_replies: true
  imap_host: ""
  imap_port: 993
  smtp_host: ""
  smtp_port: 465
  mail_user: ""
  mail_password: ""
  mail_from_name: ""
  mail_signature: ""
  check_interval_minutes: 5
  notify_min_priority: media
  mail_ignore: ""
  hq_token: ""
  elevenlabs_api_key: ""
  elevenlabs_voice_id: ""
  elevenlabs_model: eleven_flash_v2_5
  voice_tts_entity: ""
  voice_tts_voice: ""
  voice_answers: completa
  language: en
  ha_blocked_services: lock.unlock,lock.open,alarm_control_panel.alarm_disarm
  install_assist_integration: true
  non_admin_access: casa
  chat_history_turns: 20
  chat_voice_history_turns: 6
  chat_new_session_after_hours: 0
  chat_keep_sessions: 200
  chat_trash_days: 7
  chat_live_text: true
  chat_show_tools: true
  chat_max_parallel: 3
  ha_mcp_enabled: true
  ha_mcp_groups:
    - read
    - control
    - automation
    - camera
  ha_mcp_exclude_tools: ""
  ha_mcp_agents: ""
  ha_mcp_confirm: writes
  ha_mcp_free_tools: control_light,control_switch,activate_scene,control_media_player
  ha_protected_entities: ""
  ha_voice_blocked_services: lock.unlock,lock.open,alarm_control_panel.alarm_disarm,cover.open_cover
  ha_voice_exposed_only: true
  ha_action_log_days: 30
  mcp_expose: false
  mcp_expose_tools:
    - ha
  mcp_expose_read_only: true
  mcp_token: ""
  mcp_connectors: []
  mcp_use_server_instructions: true
  mcp_image_results: true
  mcp_tool_search: false
  mcp_max_result_kb: 15
schema:
  anthropic_api_key: password?
  claude_auth_mode: list(api_key|subscription|hybrid)
  claude_subscription_enabled: bool
  claude_api_fallback: bool
  model_jarvis: str
  model_mail: str
  model_voice: str?
  anthropic_credit_usd: float(0,)
  monthly_budget_usd: float(0,)
  openai_api_key: password?
  openai_base_url: str?
  ollama_url: str?
  compat_base_url: str?
  compat_api_key: password?
  other_price_input: float(0,)
  other_price_output: float(0,)
  telegram_token_jarvis: password?
  telegram_token_mail: password?
  allowed_chat_id: str?
  allowed_user_id: str?
  telegram_voice_replies: bool
  imap_host: str?
  imap_port: port
  smtp_host: str?
  smtp_port: port
  mail_user: str?
  mail_password: password?
  mail_from_name: str?
  mail_signature: str?
  check_interval_minutes: int(1,120)
  notify_min_priority: list(bassa|media|alta)
  mail_ignore: str?
  hq_token: password?
  elevenlabs_api_key: password?
  elevenlabs_voice_id: str?
  elevenlabs_model: str?
  voice_tts_entity: str?
  voice_tts_voice: str?
  voice_answers: list(completa|riassunto)
  language: list(en|nl|auto)
  ha_blocked_services: str?
  install_assist_integration: bool
  non_admin_access: list(casa|completo)
  chat_history_turns: int(4,100)
  chat_voice_history_turns: int(1,20)
  chat_new_session_after_hours: int(0,720)
  chat_keep_sessions: int(10,1000)
  chat_trash_days: int(1,90)
  chat_live_text: bool
  chat_show_tools: bool
  chat_max_parallel: int(1,8)
  ha_mcp_enabled: bool
  ha_mcp_groups:
    - list(read|control|automation|camera|dashboards|exposure|system)
  ha_mcp_exclude_tools: str?
  ha_mcp_agents: str?
  ha_mcp_confirm: list(writes|always|never)
  ha_mcp_free_tools: str?
  ha_protected_entities: str?
  ha_voice_blocked_services: str?
  ha_voice_exposed_only: bool
  ha_action_log_days: int(1,365)
  mcp_expose: bool
  mcp_expose_tools:
    - list(ha|sessions|team)
  mcp_expose_read_only: bool
  mcp_token: password?
  mcp_connectors:
    - name: str
      url: url
      token: password?
      agents: str?
      confirm: list(writes|always|never)?
      free: str?
      exclude: str?
  mcp_use_server_instructions: bool
  mcp_image_results: bool
  mcp_tool_search: bool
  mcp_max_result_kb: int(1,200)
