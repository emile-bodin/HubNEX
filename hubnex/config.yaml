name: HubNEX
version: "1.21.1"
slug: hubnex
description: Il quartier generale AI per casa e lavoro - un team di agenti Claude, plancia 3D di Home Assistant, Telegram, voce e connettori MCP.
url: https://github.com/P1pp89/HubNEX
# Immagini già pronte (GitHub Actions → ghcr.io): Home Assistant le scarica invece di costruirle
image: ghcr.io/p1pp89/{arch}-addon-hubnex
arch:
  - amd64
  - aarch64
init: false
# Accesso all'API di Home Assistant tramite il Supervisor (niente token da creare)
homeassistant_api: true
# Dashboard nella barra laterale di HA
ingress: true
ingress_port: 8765
# Visible to every Home Assistant user; who is not an administrator gets the house only
# (non_admin_access), checked by the add-on on every request.
panel_admin: false
panel_icon: mdi:robot-happy-outline
panel_title: HubNEX
# Porta esterna facoltativa (disattivata di default): serve solo per aprire la dashboard
# fuori da HA o per chiamare l'API da altri dispositivi, sempre con hq_token.
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Dashboard e API (facoltativa, richiede hq_token)
# /config dentro l'add-on = cartella addon_configs/<id>_hubnex (contiene agents.yaml)
map:
  - addon_config:rw
  # Solo per installare/aggiornare l'integrazione Assist in custom_components/hubnex
  - homeassistant_config:rw
# Annuncia l'add-on a Home Assistant: l'integrazione Assist si configura con un clic
discovery:
  - hubnex
options:
  anthropic_api_key: ""
  claude_auth_mode: api_key
  claude_subscription_enabled: false
  claude_api_fallback: false
  model_jarvis: claude-sonnet-5-5
  model_mail: claude-haiku-5-5
  model_voice: claude-haiku-5-5
  anthropic_credit_usd: 0
  monthly_budget_usd: 0
  openai_api_key: ""
  openai_base_url: ""
  ollama_url: ""
  compat_base_url: ""
  compat_api_key: ""
  other_price_input: 0
  other_price_output: 0
  telegram_token_jarvis: ""
  telegram_token_mail: ""
  allowed_chat_id: ""
  allowed_user_id: ""
  telegram_voice_replies: true
  imap_host: ""
  imap_port: 993
  smtp_host: ""
  smtp_port: 465
  mail_user: ""
  mail_password: ""
  mail_from_name: ""
  mail_signature: ""
  check_interval_minutes: 5
  notify_min_priority: media
  mail_ignore: ""
  hq_token: ""
  elevenlabs_api_key: ""
  elevenlabs_voice_id: ""
  elevenlabs_model: eleven_flash_v2_5
  voice_tts_entity: ""
  voice_tts_voice: ""
  voice_answers: completa
  language: auto
  ha_blocked_services: lock.unlock,lock.open,alarm_control_panel.alarm_disarm
  install_assist_integration: true
  non_admin_access: casa
schema:
  anthropic_api_key: password?
  claude_auth_mode: list(api_key|subscription|hybrid)
  claude_subscription_enabled: bool
  claude_api_fallback: bool
  model_jarvis: str
  model_mail: str
  model_voice: str?
  anthropic_credit_usd: float(0,)
  monthly_budget_usd: float(0,)
  openai_api_key: password?
  openai_base_url: str?
  ollama_url: str?
  compat_base_url: str?
  compat_api_key: password?
  other_price_input: float(0,)
  other_price_output: float(0,)
  telegram_token_jarvis: password?
  telegram_token_mail: password?
  allowed_chat_id: str?
  allowed_user_id: str?
  telegram_voice_replies: bool
  imap_host: str?
  imap_port: port
  smtp_host: str?
  smtp_port: port
  mail_user: str?
  mail_password: password?
  mail_from_name: str?
  mail_signature: str?
  check_interval_minutes: int(1,120)
  notify_min_priority: list(bassa|media|alta)
  mail_ignore: str?
  hq_token: password?
  elevenlabs_api_key: password?
  elevenlabs_voice_id: str?
  elevenlabs_model: str?
  voice_tts_entity: str?
  voice_tts_voice: str?
  voice_answers: list(completa|riassunto)
  language: list(auto|it|en)
  ha_blocked_services: str?
  install_assist_integration: bool
  non_admin_access: list(casa|completo)
